<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <title>CRM</title>
</head>

<body>
    <div class="flex h-screen relative overflow-hidden">
        <header class="w-[250px] bg-[#871D1F] p-4 ">
            <h1 class="text-[#FFE200] text-[22px] text-center font-bold">Frango do Félix</h1>

            <nav class="flex flex-col gap-2 mt-4 *:leading-[40px] *:rounded *:pl-4 *:text-white *:duration-200">
                <a href="#" class="hover:bg-[white] hover:text-amber-700" onclick="voltarHome()">Dashboard</a>
                <a href="#"
                    class="hover:bg-white hover:text-amber-700 active [&.active]:bg-[#E7901D] [&.active]:text-white"
                    onclick="mudarParaClientes()" id="clients">Clientes</a>
                <a href="#" class="hover:bg-white hover:text-amber-700" onclick="mudarParaProdutos()">Produtos</a>
            </nav>
        </header>
        <div class="flex-1 p-16">
            <h2 class="mb-[px] flex justify-between items-center text-[26px] font-semibold ">
                Clientes
                <button onclick="mostrarOverlay()"
                    class="mb-[33px] bg-[#E7901D] leading-[40px] rounded text-white px-6 text-[12px] uppercase font-bold hover:bg-[#871D1F]">Novo
                    cliente</button>
            </h2>
            <div class="">
                <table class="w-full mt-4 rounded overflow-hidden">
                    <thead class="*:leading-[40px]  text-left bg-red-800 text-white">
                        <th class="">Nome</th>
                        <th class="">Email</th>
                        <th class="">Telefone</th>
                        <th class="">Última compra</th>
                        <th class="w-[100px] flex justify-center gap-4">Ações</th>
                    </thead>
                    <tbody id="tabela" class="[&>*:nth-child(even)]:bg-black/5">

                    </tbody>
                </table>
            </div>
            <div onclick="mostrarOverlay()" id="overlay"
                class="w-full h-full bg-black/70 absolute top-0 left-0 duration-200 opacity-0 invisible"></div>

            <div id="gaveta" class="min-w-[350px] h-full bg-white p-4 absolute top-0 -right-full duration-200 ">
                <h3 class="flex justify-between items-center text-[#E7901D] font-bold text-2xl mb-[27px] ml-[20px]">
                    Cadastro <box-icon
                        class="w-[40px] h-[40px] rounded-full bg-[#E7901D] fill-white p-2 cursor-pointer hover:bg-[#871D1F]"
                        onclick="mostrarOverlay()" name='x'></box-icon>
                </h3>

                <form class="flex flex-col ml-[20px]" onsubmit="addClientes(event.target)">
                    <label class="block mb-2" for="nome">Nome</label>
                    <input
                        class="w-full focus:outline-[#871D1F] p-1 mb-[15px] border-solid border-[#D9D9D9] border-[1px] rounded"
                        required type="text" name="nome" placeholder="Digite seu nome">

                    <label class="block mb-2" for="email">Email</label>
                    <input
                        class="w-full focus:outline-[#871D1F] p-1 mb-[15px] border-solid border-[#D9D9D9] border-[1px] rounded"
                        required type="text" name="email" placeholder="Digite seu email">
                    <label class="block mb-2" for="telefone">Telefone</label>
                    <input
                        class="w-full focus:outline-[#871D1F] p-1 mb-[15px] border-solid border-[#D9D9D9] border-[1px] rounded"
                        required type="text" name="telefone" placeholder="(85) 99999-9999">
                    <label class="block mb-2" for="data">Data de nascimento</label>
                    <input
                        class="w-full focus:outline-[#871D1F] p-1  mb-[15px] border-solid border-[#D9D9D9] border-[1px] rounded"
                        required type="text" name="data" placeholder="DD/MM/YYYY">
                    <button
                        class="bg-[#871D1F] rounded-[6px] h-[35px] text-[#E7901D] font-bold mt-[20px]">Criar</button>
                </form>
            </div>
        </div>
    </div>




    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
    <script src="script.js"></script>
    <script src="clientes.js"></script>
</body>

</html>
