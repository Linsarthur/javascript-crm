<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>

    <title>CRM</title>
</head>

<body>
    <div class="flex h-screen relative overflow-hidden">
        <header class="w-[250px] bg-slate-600 p-4 ">
            <h1 class="text-white text-[22px] text-center font-bold">Dani Brownies CRM</h1>

            <nav class="flex flex-col gap-2 mt-4 *:leading-[40px] *:rounded *:pl-4 *:text-white *:duration-200">
                <a href="#" class="hover:bg-white hover:text-amber-700 ">Dashboard</a>
                <a href="#"
                    class="hover:bg-white hover:text-amber-700  active [&.active]:bg-pink-600 [&.active]:text-white">Clientes</a>
                <a href="#" class="hover:bg-white hover:text-amber-700 ">Produtos</a>
            </nav>

        </header>
        <div class="flex-1 p-16 ">
            <h2 class="flex justify-between items-center text-[26px] font-semibold">
                Clientes
                <button onclick="mostrarOverlay()"
                    class="bg-pink-600 leading-[40px] rounded text-white px-6 text-[12px] uppercase font-bold hover:bg-pink-700">Novo
                    cliente</button>
            </h2>
            <div onclick="mostrarOverlay()" id="overlay"
                class="w-full h-full bg-black/70 absolute top-0 left-0 duration-200 opacity-0 invisible"></div>

            <div id="gaveta" class="min-w-[350px] h-full bg-white p-4 absolute top-0 -right-full duration-200">
                <h3 class="flex justify-between items-center">Cadastro <box-icon class="w-[40px] h-[40px] rounded-full bg-pink-600 fill-white p-2 cursor-pointer hover:bg-pink-700" onclick="mostrarOverlay()" name='x'></box-icon>
                </h3>
            </div>
        </div>
    </div>




    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
    <script src="script.js"></script>
</body>

</html>
